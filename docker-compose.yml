services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/code/data
    environment:
      - DATABASE_URL=sqlite:///./data/grc_tracker.db
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-}
