services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-grc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-grc}
      - POSTGRES_DB=${POSTGRES_DB:-grc}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc} -d ${POSTGRES_DB:-grc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/code/data
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-grc}:${POSTGRES_PASSWORD:-grc}@db:5432/${POSTGRES_DB:-grc}
      - TRUST_ORG_NAME=${TRUST_ORG_NAME:-Your Organisation}
      - TRUST_CONTACT_EMAIL=${TRUST_CONTACT_EMAIL:-}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
