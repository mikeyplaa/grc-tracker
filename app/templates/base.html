<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GRC Tracker{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #171e2e;
      --border: #2a3348;
      --text: #e6e9f0;
      --muted: #8a93a8;
      --accent: #5b8def;
      --not-started: #6b7280;
      --in-progress: #d97706;
      --implemented: #2563eb;
      --evidenced: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    header a { color: var(--text); text-decoration: none; }
    header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    header .tagline { color: var(--muted); font-size: 0.85rem; }
    main { padding: 1.5rem 2rem 3rem; max-width: 1000px; margin: 0 auto; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 2rem 0 0.75rem; }
    h2:first-child { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    tr:hover td { background: var(--panel); }
    a.control-link { color: var(--accent); text-decoration: none; }
    a.control-link:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }
    .badge.not-started { background: var(--not-started); }
    .badge.in-progress { background: var(--in-progress); }
    .badge.implemented { background: var(--implemented); }
    .badge.evidenced { background: var(--evidenced); }
    .badge.stale { background: #b91c1c; margin-left: 0.4rem; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: var(--text); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
    .panel dt { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.9rem; }
    .panel dt:first-child { margin-top: 0; }
    .panel dd { margin: 0.25rem 0 0; }
    .empty { color: var(--muted); font-style: italic; font-size: 0.9rem; }
    label { color: var(--muted); font-size: 0.8rem; }
    input[type="text"], input[type="date"], select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.9rem;
    }
    input[type="file"] { color: var(--text); font-size: 0.85rem; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 0.45rem 0.9rem; font-size: 0.85rem; cursor: pointer; margin-left: 0.5rem;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <a href="/controls"><h1>GRC Tracker</h1></a>
    <span class="tagline">ISO 27001:2022 Annex A</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
