<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🛡️</text></svg>">
  <title>{% block title %}GRC Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header>
    <a href="/controls"><h1>🛡️ GRC Tracker</h1></a>
    <span class="tagline">ISO 27001:2022 &amp; SOC 2</span>
    <nav>
      {% if request.session.get('authenticated') %}
        <a href="/controls" class="{{ 'active' if request.url.path.startswith('/controls') else '' }}">Controls</a>
        <a href="/dashboard" class="{{ 'active' if request.url.path.startswith('/dashboard') else '' }}">Dashboard</a>
        <a href="/trust" class="{{ 'active' if request.url.path.startswith('/trust') else '' }}">Trust Centre</a>
        <a href="/logout">Log out</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Personal GRC / Compliance Tracker &middot; ISO 27001:2022 &amp; SOC 2</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
