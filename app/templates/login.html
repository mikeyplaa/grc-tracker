{% extends "base.html" %}
{% block title %}Sign in · GRC Tracker{% endblock %}
{% block content %}
  <div class="panel" style="max-width: 340px; margin: 3rem auto;">
    <h2 style="margin-top:0;">Sign in</h2>
    {% if error %}<p style="color:#f87171; font-size:0.9rem;">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label><br>
      <input id="username" name="username" type="text" required autofocus style="width:100%;"><br><br>
      <label for="password">Password</label><br>
      <input id="password" name="password" type="password" required style="width:100%;"><br><br>
      <button type="submit" style="width:100%; margin-left:0;">Sign in</button>
    </form>
  </div>
{% endblock %}
